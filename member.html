document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

v style=\"font-family:'Noto Serif SC',serif;font-size:27px;line-height:1.9;color:#253544;font-weight:500;text-align:center;margin-top:34px\">一颗星球，<br>等一个名字。<\/div>\n    <div style=\"font-size:12.5px;line-height:2.1;color:#5E7284;font-weight:300;text-align:center;margin-top:10px\">它会随你的成长慢慢改变。<br>今天，先为它取名。<\/div>\n    <div style=\"position:relative;width:320px;height:320px;margin-top:4px\">\n      <div style=\"position:absolute;inset:50px;border-radius:50%;background:radial-gradient(circle at 38% 30%, #FFFFFF, #ECF3F9 60%, #DCE9F3);border:1px solid #BFD3E2;box-shadow:0 18px 34px -22px rgba(91,126,159,.4);animation:breathe 8s ease-in-out infinite\"><\/div>\n    <\/div>\n    <div style=\"font-size:12px;color:#5B7E9F;margin-top:8px;letter-spacing:.08em\">请在此输入你的星球名称 ↓<\/div>\n    <input value=\"{{k.draft}}\" sc-camel-on-change=\"{{k.onDraft}}\" sc-camel-on-key-down=\"{{k.onKey}}\" placeholder=\"给你的星球取个名字\" style=\"margin-top:10px;width:236px;border:1px solid #A8C3D9;border-radius:999px;background:rgba(255,255,255,.8);outline:none;text-align:center;font-size:16px;font-family:'Noto Serif SC',serif;color:#253544;padding:12px 16px;box-sizing:border-box\" style-focus=\"border-color:#5B7E9F;box-shadow:0 0 0 3px rgba(91,126,159,.15)\">\n    <sc-if value=\"{{k.hint}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"font-size:11px;color:#B0785E;margin-top:10px;font-weight:300;animation:fadeup .3s ease both\">先给它取个名字，再出发 ✍<\/div>\n    <\/sc-if>\n    <sc-if value=\"{{k.noHint}}\" hint-placeholder-val=\"{{true}}\">\n      <div style=\"font-size:11px;color:#8FA9BD;margin-top:10px;font-weight:300\">例如：B612星球、晨光星、向日葵星……<\/div>\n    <\/sc-if>\n    <div sc-camel-on-click=\"{{k.onConfirm}}\" style=\"margin-top:24px;background:#2B3A4A;color:#F3F7FA;font-size:14px;letter-spacing:.25em;padding:14px 46px;border-radius:999px;cursor:pointer;min-height:44px;box-sizing:border-box\" style-hover=\"background:#1E2A37\">确认命名<\/div>\n  <\/div>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<!-- 生长动画 -->\n<sc-if value=\"{{k.isGrow}}\" hint-placeholder-val=\"{{false}}\">\n<div data-screen-label=\"生长\" style=\"min-height:100vh;background:linear-gradient(180deg,#FAFCFE 0%,#F3F7FA 40%)\">\n<div style=\"max-width:430px;margin:0 auto;min-height:100vh;padding:36px 0 46px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center\">\n  <div style=\"font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:.45em;color:#7A94AB\">MY PLANET<\/div>\n  <div style=\"display:flex;flex-direction:column;align-items:center;padding:0 32px\">\n    <div style=\"font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:.2em;color:#7A94AB;margin-top:26px\">第 {{k.growDay}} 天<\/div>\n    <div style=\"position:relative;width:320px;height:320px;margin-top:6px\">\n      <div style=\"position:absolute;inset:50px;border-radius:50%;background:radial-gradient(circle at 38% 30%, #FFFFFF, #ECF3F9 60%, #DCE9F3);border:1px solid #BFD3E2;box-shadow:0 18px 34px -22px rgba(91,126,159,.4)\"><\/div>\n      <sc-for list=\"{{k.els}}\" as=\"el\" hint-placeholder-count=\"3\">\n        <div style=\"{{el.wrapStyle}}\"><div style=\"{{el.innerStyle}}\"><span style=\"{{el.dotStyle}}\"><\/span><\/div><\/div>\n      <\/sc-for>\n    <\/div>\n    <div style=\"font-family:'Noto Serif SC',serif;font-size:15px;color:#3C4E5F;margin-top:6px;letter-spacing:.14em\">「{{k.name}}」· 生长中<\/div>\n    <div style=\"font-size:11px;color:#8FA9BD;margin-top:8px;font-weight:300\">每一个小圆点，都是一天的痕迹<\/div>\n  <\/div>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<!-- 白天 -->\n<sc-if value=\"{{k.showDay}}\" hint-placeholder-val=\"{{false}}\">\n<div data-screen-label=\"白天\" style=\"min-height:100vh;background:linear-gradient(180deg, #EFF5F9, #F3F7FA 40%, #E9F1F7)\">\n<div style=\"max-width:430px;margin:0 auto;min-height:100vh;padding:26px 0 44px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;animation:fadeup .5s ease both\">\n  <div style=\"align-self:stretch;display:flex;align-items:center;justify-content:space-between;padding:0 22px\">\n    <div style=\"font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:.45em;color:#7A94AB\">MY PLANET<\/div>\n    <div sc-camel-on-click=\"{{k.toggle}}\" style=\"display:flex;align-items:center;gap:2px;border:1px solid #C9D9E5;border-radius:999px;padding:3px;cursor:pointer;background:rgba(255,255,255,.7);min-height:32px;box-sizing:border-box\">\n      <span style=\"font-size:10.5px;color:#F3F7FA;background:#2B3A4A;border-radius:999px;padding:5px 11px\">☀ 白天<\/span>\n      <span style=\"font-size:10.5px;color:#8FA9BD;padding:5px 11px\">☾ 夜晚<\/span>\n    <\/div>\n  <\/div>\n  <div style=\"font-family:'Ma Shan Zheng',cursive;font-size:34px;color:#253544;letter-spacing:.05em;margin-top:22px\">{{k.name}}<\/div>\n  <div style=\"display:flex;align-items:baseline;gap:14px;margin-top:10px\">\n    <div style=\"font-size:12px;color:#5E7284;font-weight:300\">第 98 天<\/div>\n    <div sc-camel-on-click=\"{{k.onWeather}}\" style=\"font-size:12px;color:#3C4E5F;font-weight:300;cursor:pointer;border-bottom:1px dashed #A8C3D9;padding-bottom:1px\">{{k.weather}} ↻<\/div>\n  <\/div>\n  <div style=\"position:relative;width:320px;height:320px;margin-top:4px\">\n    <div style=\"position:absolute;left:50%;bottom:34px;width:200px;height:28px;transform:translateX(-50%);border-radius:50%;background:rgba(91,126,159,.2);filter:blur(11px)\"><\/div>\n    <div style=\"position:absolute;inset:50px;border-radius:50%;background:radial-gradient(circle at 34% 26%, #FFFFFF 0%, #F2F7FB 34%, #DCE9F3 60%, #C2D6E6 82%, #ABC5DA);border:1px solid #BFD3E2;box-shadow:0 26px 46px -20px rgba(91,126,159,.55), inset -24px -28px 50px rgba(122,148,171,.42), inset 14px 16px 30px rgba(255,255,255,.85);animation:breathe 8s ease-in-out infinite\"><\/div>\n    <div style=\"position:absolute;inset:50px;border-radius:50%;background:radial-gradient(circle at 70% 76%, rgba(122,148,171,.24), rgba(122,148,171,0) 55%)\"><\/div>\n    <div style=\"position:absolute;inset:50px;border-radi 5,217,.3);border-radius:14px;padding:12px 14px;background:rgba(232,240,247,.06);margin-right:18px\">\n                <div style=\"font-size:10px;color:#8FA9BD;letter-spacing:.1em\">第 98 天 · 你寄出<\/div>\n                <div style=\"font-size:12px;color:#C7D6E4;line-height:1.9;font-weight:300;margin-top:4px\">{{lt.text}}<\/div>\n              <\/div>\n            <\/sc-for>\n            <textarea value=\"{{k.mailDraft}}\" sc-camel-on-change=\"{{k.onMailDraft}}\" placeholder=\"写一封给创始人的信……\" style=\"width:100%;box-sizing:border-box;border:1px solid rgba(168,195,217,.35);border-radius:12px;background:rgba(232,240,247,.07);outline:none;resize:none;height:72px;padding:10px 12px;font-family:'Noto Sans SC',sans-serif;font-size:12px;color:#E8F0F7;line-height:1.8\"><\/textarea>\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <div sc-camel-on-click=\"{{k.onMailSend}}\" style=\"background:#DCE9F3;color:#16233A;font-size:12px;letter-spacing:.12em;padding:10px 22px;border-radius:999px;cursor:pointer\" style-hover=\"background:#FFFFFF\">寄出 ✉<\/div>\n              <sc-if value=\"{{k.hasLetters}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"font-size:10.5px;color:#8FA9BD;font-weight:300\">信已寄出，创始人会在 1–3 天内回信<\/div>\n              <\/sc-if>\n            <\/div>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n    <\/sc-for>\n    <div style=\"border-top:1px solid rgba(168,195,217,.25)\"><\/div>\n  <\/div>\n  <div style=\"position:relative;z-index:1;margin-top:36px;text-align:center\">\n    <div style=\"font-family:'Ma Shan Zheng',cursive;font-size:21px;line-height:2;color:#E8F0F7\">「{{k.name}}」已经陪你走了一小段。<br>如果愿意，让它真正属于你。<\/div>\n    <div style=\"margin-top:20px;background:#DCE9F3;color:#16233A;font-size:14px;letter-spacing:.14em;padding:15px 40px;border-radius:999px;cursor:pointer;display:inline-block;min-height:44px;box-sizing:border-box\" style-hover=\"background:#FFFFFF\">成为主人 · ¥699<\/div>\n    <div style=\"font-size:11px;color:#8FA9BD;margin-top:12px;font-weight:300\">创始席位仅前 10 位 ¥699 · 此后 ¥1,920 / 年<\/div>\n  <\/div>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;growSeconds&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 4.5, &quot;min&quot;: 2, &quot;max&quot;: 8, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;s&quot;, &quot;section&quot;: &quot;生长动画&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { o: { k: { phase: 'name', draft: '', name: '', growDay: 0, sel: -1, tab: -1, w: 0, night: false, tarot: -1 } } };\n    this.TAROT = [\n      { name: '月亮', line: '今晚，允许自己慢下来。' },\n      { name: '种子', line: '有些变化，正在看不见的地方发生。' },\n      { name: '灯塔', line: '你已经比想象中走得更远。' }\n    ];\n    this.WEATHER = [\n      '今天：有点想放空的晴天',\n      '今天：适合慢慢来的多云',\n      '今天：心里下过一阵小雨，现在停了',\n      '今天：晚风刚刚好'\n    ];\n    this.ELS = [\n      { type: 'stone',     day: 5,  story: '来到星球的第一周，安放下一个小小的开始', angle: -104, fly: false },\n      { type: 'grass',     day: 12, story: '在星光课堂听完一节，长出一株小草',       angle: -76, fly: false },\n      { type: 'flower',    day: 27, story: '今日星情写下一段心事，开出一朵蓝色的花', angle: -46, c1: '#A3B6C6', fly: false },\n      { type: 'firefly',   day: 38, story: '深夜写完一篇星光日志，飞来一只萤火虫',   angle: -18, fly: true },\n      { type: 'flower',    day: 45, story: '今日星情开出一朵花',                     angle: 10,  c1: '#D8C09A', fly: false },\n      { type: 'bird',      day: 58, story: '星际信箱寄出第一封信，落下一只小鸟',     angle: 38,  fly: true },\n      { type: 'butterfly', day: 70, story: '星际信箱收到创始人来信，飞来一只蝴蝶',   angle: 66,  fly: true },\n      { type: 'grass',     day: 83, story: '又一节星光课堂，草丛更茂盛了',           angle: 96,  fly: false },\n      { type: 'flower',    day: 91, story: '连续陪伴三个月，开出第一朵柔绿色的花',   angle: 124, c1: '#A9BD9B', fly: false }\n    ];\n    this.TABS = [\n      { num: '01', name: '星光课堂', en: 'STAR CLASS', desc: '听创始人准备的音频与视频，完成一个小小的练习——这是往内输入。每一次学习，星球上都会长出新的绿。' },\n      { num: '02', name: '今日星情', en: 'TODAY MOOD', desc: '塔罗式挑一张牌，再自由写下此刻的心情、收获或情绪——这是往外表达。每一次表达，都可能开出一朵花。' },\n      { num: '03', name: '星际信箱', en: 'STAR MAIL', desc: '与三位创始人双向通信。她们，是你星球上唯一的来访者。' }\n    ];\n  }\n\n  componentDidMount() {\n    try {\n      const d = JSON.parse(localStorage.getItem('planet_notes_v1') || '{}');\n      const extras = (d.moods || []).map((s, i) => this.mkExtra(s, i));\n      this.set('k', { extras: extras, letters: d.letters || [] });\n    } catch (e) {}\n  }\n\n  mkExtra(raw, i) {\n    return { type: 'newstar', raw: raw, day: 98, story: '今日星情 ·「' + raw + '」', angle: 150 + (i % 8) * 26, fly: true };\n  }\n\n  persist(extras, letters) {\n    try {\n      localStorage.setItem('planet_notes_v1', JSON.stringify({ moods: (extras || []).map(e => e.raw), letters: letters || [] }));\n    } catch (e) {}\n  }\n\n  allEls() {\n    return this.ELS.concat(this.state.o.k.extras || []);\n  }\n\n  set(k, patch) {\n    this.setState(s => ({ o: Object.assign({}, s.o, { [k]: Object.assign({}, s.o[k], patch) }) }));\n  }\n\n  confirm(k) {\n    const name = (this.state.o[k].draft || '').trim();\n    if (!name) { this.set(k, { hint: true }); return; }\n    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) { this.set(k, { name: name, phase: 'mature', growDay: 98 }); return; }\n    this.set(k, { name: name, phase: 'grow', growDay: 1 });\n    const secs = this.props.growSeconds ?? 4.5;\n    const t0 = performance.now();\n    let last = 1;\n    const tick = (now) => {\n      const p = Math.min(1, (now - t0) / (secs * 1000));\n      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;\n      const d = Math.max(1, Math.round(1 + 97 * e));\n      if (d !== last) { last = d; this.set(k, { growDay: d }); }\n      if (p < 1) requestAnimationFrame(tick);\n      else setTimeout(() => this.set(k, { phase: 'mature', growDay: 98 }), 700);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  mkEls(k, box, R) {\n    const o = this.state.o[k];\n    const grow = o.phase === 'grow';\n    const mature = o.phase === 'mature';\n    const cx = box / 2, cy = box / 2;\n    const out = [];\n    const DOTC = { stone: '#B9C6D2', grass: '#8FB3A0', flower: '#7C9BE8', firefly: '#E8C97A', butterfly: '#9FB8F0', bird: '#6E8FB8', newstar: '#E8C97A' };\n    this.allEls().forEach((el, i) => {\n      if (el.day > o.growDay) return;\n      const rad = el.angle * Math.PI / 180;\n      const r = el.fly ? R + 26 : R - 2;\n      const w = 30, h = 40;\n      const x = cx + r * Math.sin(rad);\n      const y = cy - r * Math.cos(rad);\n      out.push({\n        wrapStyle: {\n          position: 'absolute',\n          left: (x - w / 2) + 'px',\n          top: (y - h) + 'px',\n          width: w + 'px',\n          height: h + 'px',\n          display: 'flex',\n          alignItems: 'flex-end',\n          justifyContent: 'center',\n          transform: el.fly ? 'none' : 'rotate(' + el.angle + 'deg)',\n          transformOrigin: '50% 100%',\n          cursor: mature ? 'pointer' : 'default',\n          zIndex: 3\n        },\n        innerStyle: (() => {\n          let anim = '';\n          if (grow) anim = 'sprout .8s cubic-bezier(.34,1.4,.5,1) both';\n          if (el.fly) anim = anim ? anim + ', drift 4.5s 1s ease-in-out infinite' : 'drift 4.5s ease-in-out infinite';\n          return anim ? { animation: anim } : {};\n        })(),\n        dotStyle: el.type === 'newstar'\n          ? { display: 'block', width: '10px', height: '10px', borderRadius: '50%', background: '#E8C97A', boxShadow: '0 0 0 3px rgba(255,255,255,.6), 0 0 14px rgba(232,201,122,.95)', animation: 'glowp 3s ease-in-out infinite' }\n          : { display: 'block', width: '9px', height: '9px', borderRadius: '50%', background: (el.type === 'flower' && el.c1) ? el.c1 : DOTC[el.type], boxShadow: '0 0 0 3px rgba(255,255,255,.55)' },\n        onClick: () => { if (this.state.o[k].phase === 'mature') this.set(k, { sel: this.state.o[k].sel === i ? -1 : i }); }\n      });\n    });\n    return out;\n  }\n\n  renderVals() {\n    const o = this.state.o.k;\n    const selEl = o.sel >= 0 ? this.allEls()[o.sel] : null;\n    const k = {\n      name: o.name || '晨光星',\n      isName: o.phase === 'name',\n      isGrow: o.phase === 'grow',\n      showDay: o.phase === 'mature' && !o.night,\n      showNight: o.phase === 'mature' && !!o.night,\n      draft: o.draft,\n      growDay: o.growDay,\n      hint: !!o.hint,\n      noHint: !o.hint,\n      onDraft: (e) => this.set('k', { draft: e.target.value, hint: false }),\n      onKey: (e) => { if (e.key === 'Enter') this.confirm('k'); },\n      onConfirm: () => this.confirm('k'),\n      toggle: () => this.set('k', { night: !this.state.o.k.night }),\n      els: this.mkEls('k', 320, 110),\n      hasSel: o.sel >= 0,\n      noSel: o.sel < 0,\n      selDay: selEl ? selEl.day : '',\n      selStory: selEl ? selEl.story : '',\n      weather: this.WEATHER[o.w],\n      onWeather: () => this.set('k', { w: (this.state.o.k.w + 1) % this.WEATHER.length }),\n      tabs: this.TABS.map((t, i) => Object.assign({}, t, {\n        active: o.tab === i,\n        showClass: o.tab === i && i === 0,\n        showMood: o.tab === i && i === 1,\n        showMail: o.tab === i && i === 2,\n        onClick: () => this.set('k', { tab: this.state.o.k.tab === i ? -1 : i })\n      })),\n      cards: this.TAROT.map((t, i) => ({ onClick: () => this.set('k', { tarot: i }) })),\n      noTarot: o.tarot < 0,\n      hasTarot: o.tarot >= 0,\n      tarotName: o.tarot >= 0 ? this.TAROT[o.tarot].name : '',\n      tarotLine: o.tarot >= 0 ? this.TAROT[o.tarot].line : '',\n      onTarotReset: () => this.set('k', { tarot: -1, moodSaved: false }),\n      moodDraft: o.moodDraft || '',\n      moodSaved: !!o.moodSaved,\n      moodNotSaved: !o.moodSaved,\n      onMoodDraft: (e) => this.set('k', { moodDraft: e.target.value }),\n      onMoodSave: () => {\n        const t = (this.state.o.k.moodDraft || '').trim();\n        if (!t) return;\n        const cur = this.state.o.k.extras || [];\n        const ex = cur.concat([this.mkExtra(t, cur.length)]);\n        this.set('k', { extras: ex, moodDraft: '', moodSaved: true });\n        this.persist(ex, this.state.o.k.letters);\n      },\n      onMoodAgain: () => this.set('k', { tarot: -1, moodSaved: false }),\n      letters: o.letters || [],\n      hasLetters: (o.letters || []).length > 0,\n      mailDraft: o.mailDraft || '',\n      onMailDraft: (e) => this.set('k', { mailDraft: e.target.value }),\n      onMailSend: () => {\n        const t = (this.state.o.k.mailDraft || '').trim();\n        if (!t) return;\n        const ls = (this.state.o.k.letters || []).concat([{ text: t }]);\n        this.set('k', { letters: ls, mailDraft: '' });\n        this.persist(this.state.o.k.extras, ls);\n      }\n    };\n    return { k: k };\n  }\n}\n<\/script>\n\n\n\n<div id=\"hlos-qr-overlay\" style=\"position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(37,53,68,0.55);backdrop-filter:blur(4px);padding:24px\" onclick=\"if(event.target===this)this.style.display='none'\">\n  <div style=\"background:#FFFFFF;border-radius:20px;max-width:340px;width:100%;padding:36px 28px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,0.35)\">\n    <div style=\"font-family:'Noto Serif SC',serif;font-size:19px;color:#253544;font-weight:500\">成为人生主理人<\/div>\n    <div style=\"font-size:12px;color:#5E7284;margin-top:8px;line-height:1.9\">扫码添加主理人微信<br>备注「主理人计划」<\/div>\n    <img src=\"images/wechat-qr.png\" alt=\"主理人微信二维码\" style=\"width:200px;height:200px;margin:20px auto 0;display:block;border-radius:12px;border:1px solid #DCE9F3;object-fit:contain\" onerror=\"this.style.display='none';document.getElementById('hlos-qr-fallback').style.display='flex'\"/>\n    <div id=\"hlos-qr-fallback\" style=\"display:none;width:200px;height:200px;margin:20px auto 0;border-radius:12px;border:1px dashed #BFD3E2;align-items:center;justify-content:center;color:#8FA9BD;font-size:12px;letter-spacing:.08em\">二维码即将上线<\/div>\n    <div style=\"margin-top:22px\"><button onclick=\"document.getElementById('hlos-qr-overlay').style.display='none'\" style=\"border:1px solid #DCE9F3;background:none;border-radius:999px;padding:8px 26px;font-size:12px;color:#5E7284;cursor:pointer\">关闭<\/button><\/div>\n  <\/div>\n<\/div>\n<a href=\"index.html\" style=\"position:fixed;top:16px;left:16px;z-index:9990;background:rgba(255,255,255,0.85);backdrop-filter:blur(6px);border:1px solid #DCE9F3;border-radius:999px;padding:9px 18px;font-size:12px;letter-spacing:.12em;color:#3A5068;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 6px 18px -10px rgba(91,126,159,0.4)\">← 回到主页<\/a>\n<script>\ndocument.addEventListener('click', function(e){\n  var n = e.target;\n  while (n && n !== document.body) {\n    if (n.textContent && n.textContent.trim() === '成为主人 · ¥699') {\n      document.getElementById('hlos-qr-overlay').style.display = 'flex';\n      break;\n    }\n    n = n.parentElement;\n  }\n}, true);\n<\/script>\n<\/body><\/html>"
</script>
